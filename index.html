<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QR Code Generator</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg-color: #1f1f2e;
      --primary-color: #ff7f50;
      --secondary-color: #2f2f3e;
      --text-color: #ffffff;
      --input-bg: #3b3b4f;
      --input-hover: #4b4b60;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      font-family: 'Poppins', sans-serif;
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      background-color: var(--secondary-color);
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.4);
      max-width: 400px;
      width: 90%;
      text-align: center;
    }

    h2 {
      margin-bottom: 1rem;
      color: var(--primary-color);
    }

    select,
    textarea,
    input[type="submit"],
    button {
      width: 100%;
      margin-top: 1rem;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      background-color: var(--input-bg);
      color: white;
      font-size: 1rem;
      transition: background 0.3s;
    }

    select:hover,
    textarea:hover {
      background-color: var(--input-hover);
    }

    input[type="submit"],
    button {
      background-color: var(--primary-color);
      font-weight: 600;
      cursor: pointer;
    }

    input[type="submit"]:hover,
    button:hover {
      background-color: #ff6333;
    }

    #img {
      margin: 1.5rem auto;
      max-width: 100%;
      border-radius: 0.5rem;
      background: #fff;
      padding: 0.5rem;
    }

    p {
      margin-top: 2rem;
      font-size: 0.9rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>QR Code Generator</h2>
    <img src="" id="img" alt="QR Code will appear here" />

    <select id="size">
      <option value="100">100x100</option>
      <option value="150">150x150</option>
      <option value="200">200x200</option>
      <option value="250" selected>250x250</option>
      <option value="300">300x300</option>
    </select>

    <textarea id="qrtext" rows="3" placeholder="Enter your text here..."></textarea>
    <input type="submit" value="Generate" onclick="genQR()" />
    <button onclick="downloadQR()">Download</button>

    <p>Made by Darshan Rana</p>
  </div>

  <script>
    function genQR() {
      const baseURL = "https://api.qrserver.com/v1/create-qr-code/?size=";
      const img = document.getElementById("img");
      const text = document.getElementById("qrtext").value.trim();
      const size = document.getElementById("size").value;

      if (text) {
        img.src = `${baseURL}${size}x${size}&data=${encodeURIComponent(text)}`;
      } else {
        img.src = "";
        alert("Please enter some text!");
      }
    }

    function downloadQR() {
      const img = document.getElementById("img");
      if (!img.src) {
        alert("Generate a QR code first!");
        return;
      }
      const link = document.createElement("a");
      link.href = img.src;
      link.download = "qrcode.png";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
